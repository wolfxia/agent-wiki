<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Wiki Compile Pipeline</title>
  <desc id="desc">Flow from raw intake through compile_prepare, review queue, concurrent LLM generation, serialized compile_update, telemetry, truth zone, and improved retrieval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #5f6b7a; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-copy { font-size: 12px; fill: #4b5563; }
      .small { font-size: 11px; fill: #5f6b7a; }
      .lane { font-size: 12px; font-weight: 700; fill: #52606d; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect x="18" y="18" width="1064" height="484" rx="18" fill="#ffffff" stroke="#d7dee8"/>
  <text x="550" y="56" text-anchor="middle" class="title">Compile Pipeline: Raw Evidence to Agent Working Memory</text>
  <text x="550" y="80" text-anchor="middle" class="subtitle">Compiled truth-zone pages optimize agent retrieval and reasoning first; human presentation is secondary.</text>

  <rect x="46" y="110" width="1008" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="136" class="lane">DETERMINISTIC PREPARATION</text>

  <rect x="76" y="158" width="145" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="148" y="181" text-anchor="middle" class="box-title">Raw intake</text>
  <text x="148" y="199" text-anchor="middle" class="box-copy">capture_raw / pull-view</text>

  <rect x="275" y="146" width="178" height="78" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="364" y="169" text-anchor="middle" class="box-title">compile_prepare</text>
  <text x="364" y="187" text-anchor="middle" class="box-copy">claims · relations · conflicts</text>
  <text x="364" y="205" text-anchor="middle" class="box-copy">source_refs · output hint</text>

  <rect x="506" y="146" width="178" height="78" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="595" y="169" text-anchor="middle" class="box-title">review_queue</text>
  <text x="595" y="187" text-anchor="middle" class="box-copy">compile_suggestion</text>
  <text x="595" y="205" text-anchor="middle" class="box-copy">open → assigned → resolved</text>

  <rect x="738" y="146" width="145" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="810" y="169" text-anchor="middle" class="box-title">Agent compile</text>
  <text x="810" y="187" text-anchor="middle" class="box-copy">parallel JSON generate</text>
  <text x="810" y="205" text-anchor="middle" class="box-copy">metadata + retry telemetry</text>

  <rect x="926" y="146" width="98" height="78" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="975" y="169" text-anchor="middle" class="box-title">compile</text>
  <text x="975" y="187" text-anchor="middle" class="box-title">update</text>
  <text x="975" y="205" text-anchor="middle" class="box-copy">serial B gate</text>

  <path d="M 221 185 H 275" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 453 185 H 506" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 684 185 H 738" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 883 185 H 926" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="46" y="274" width="1008" height="140" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="300" class="lane">TRUTH ZONE AND RETRIEVAL LOOP</text>

  <rect x="110" y="330" width="180" height="58" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="200" y="353" text-anchor="middle" class="box-title">Truth zone</text>
  <text x="200" y="371" text-anchor="middle" class="box-copy">atom / synthesis working memory</text>

  <rect x="390" y="330" width="190" height="58" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <text x="485" y="353" text-anchor="middle" class="box-title">Retrieval indexes</text>
  <text x="485" y="371" text-anchor="middle" class="box-copy">summary · aliases · FTS · topic index</text>

  <rect x="680" y="330" width="200" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="353" text-anchor="middle" class="box-title">Agent reasoning</text>
  <text x="780" y="371" text-anchor="middle" class="box-copy">better query answers and curation</text>

  <path d="M 975 224 V 258 H 200 V 330" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 290 359 H 390" fill="none" stroke="#65a30d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 580 359 H 680" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 780 330 C 780 260 380 260 364 224" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <text x="550" y="456" text-anchor="middle" class="small">Loop: improved retrieval exposes gaps → maintain queues compile_suggestion → agents generate concurrently → serialized writes update truth-zone memory and queue telemetry.</text>
</svg>
