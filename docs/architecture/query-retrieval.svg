<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="title desc">
  <title id="title">查询检索流程</title>
  <desc id="desc">Agent Wiki query and retrieval flow with orthogonal routing and layered output.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0277bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18222d; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 12px; font-weight: 700; fill: #52606d; letter-spacing: 0.4px; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-copy { font-size: 12px; }
      .note-title { font-size: 14px; font-weight: 700; }
      .note-copy { font-size: 12px; }
      .chip { font-size: 11px; font-weight: 700; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #4c4353; }
      .frame { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; }
      .muted { fill: #5c6773; }
    </style>
  </defs>

  <rect x="20" y="20" width="940" height="720" rx="18" fill="#ffffff" stroke="#d7dee8"/>
  <text x="490" y="58" text-anchor="middle" class="title">查询检索流程</text>
  <text x="490" y="82" text-anchor="middle" class="muted" font-size="13">先做查询类型路由，再做粗检索、聚合、加载，最后按 L1 / L2 / L3 返回。</text>

  <text x="40" y="125" class="section">INPUT</text>
  <text x="270" y="125" class="section">ROUTING</text>
  <text x="560" y="125" class="section">SIDE RULES</text>
  <text x="40" y="545" class="section">OUTPUT</text>

  <rect x="40" y="140" width="170" height="90" rx="16" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="125" y="172" text-anchor="middle" class="box-title">query 输入</text>
  <text x="125" y="194" text-anchor="middle" class="box-copy">wiki_id · query</text>
  <text x="125" y="212" text-anchor="middle" class="box-copy">include_pending · max_sensitivity</text>

  <rect x="250" y="140" width="250" height="90" rx="16" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="375" y="170" text-anchor="middle" class="box-title">Query Router</text>
  <text x="375" y="192" text-anchor="middle" class="box-copy">fact · concept · procedure</text>
  <text x="375" y="210" text-anchor="middle" class="box-copy">comparison · decision · dispute</text>

  <rect x="250" y="270" width="250" height="90" rx="16" fill="#c5e1a5" stroke="#558b2f" stroke-width="2"/>
  <text x="375" y="302" text-anchor="middle" class="box-title">Coarse Retrieval</text>
  <text x="375" y="324" text-anchor="middle" class="box-copy">RetrievalProvider.search()</text>
  <text x="375" y="342" text-anchor="middle" class="box-copy">Phase 1: Lexical · Optional: Vector</text>

  <rect x="250" y="400" width="250" height="66" rx="16" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="375" y="428" text-anchor="middle" class="box-title">Aggregate</text>
  <text x="375" y="448" text-anchor="middle" class="box-copy">按 wiki_id:doc_id 去重并收敛候选集</text>

  <rect x="250" y="500" width="250" height="66" rx="16" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="375" y="528" text-anchor="middle" class="box-title">Load Pages / Sections</text>
  <text x="375" y="548" text-anchor="middle" class="box-copy">整页或 section 加载，并展开 cross_refs</text>

  <rect x="590" y="390" width="300" height="78" rx="16" fill="#fce4ec" stroke="#880e4f" stroke-width="2"/>
  <text x="740" y="420" text-anchor="middle" class="note-title">Pending Overlay</text>
  <text x="740" y="440" text-anchor="middle" class="note-copy">raw 默认可查；truth zone 仅在</text>
  <text x="740" y="458" text-anchor="middle" class="note-copy">include_pending=true 时叠加</text>

  <rect x="590" y="500" width="300" height="66" rx="16" fill="#fce4ec" stroke="#880e4f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="740" y="528" text-anchor="middle" class="note-title">Dispute Rule</text>
  <text x="740" y="548" text-anchor="middle" class="note-copy">标注冲突来源，不自动替代理由裁决</text>

  <rect x="40" y="608" width="220" height="58" rx="16" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="150" y="635" text-anchor="middle" class="box-title">L1 答案层</text>
  <text x="150" y="655" text-anchor="middle" class="box-copy">短答复，直接给结论</text>

  <rect x="350" y="608" width="220" height="58" rx="16" fill="#c5e1a5" stroke="#558b2f" stroke-width="2"/>
  <text x="460" y="635" text-anchor="middle" class="box-title">L2 上下文层</text>
  <text x="460" y="655" text-anchor="middle" class="box-copy">相关页面摘要与 cross_refs</text>

  <rect x="660" y="608" width="220" height="58" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="635" text-anchor="middle" class="box-title">L3 证据链层</text>
  <text x="770" y="655" text-anchor="middle" class="box-copy">raw 引用与 source_refs 完整路径</text>

  <rect x="180" y="86" width="120" height="28" rx="14" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="240" y="105" text-anchor="middle" class="chip">query_type 分类</text>

  <rect x="565" y="86" width="100" height="28" rx="14" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="615" y="105" text-anchor="middle" class="chip">T1/T2 全量查询</text>
  <rect x="675" y="86" width="245" height="28" rx="14" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="797.5" y="105" text-anchor="middle" class="chip">T3 保留: fact / concept / procedure</text>

  <path d="M 210 185 H 250" fill="none" stroke="#0277bd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 375 230 V 270" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M 375 360 V 400" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 375 466 V 500" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M 500 433 H 590" fill="none" stroke="#880e4f" stroke-width="2" stroke-dasharray="7 5"/>

  <path d="M 375 566 V 592 H 150 V 608" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M 375 566 V 608" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 375 566 V 592 H 770 V 608" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M 770 608 V 592 H 740 V 566" fill="none" stroke="#880e4f" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="290" y="694" width="400" height="30" rx="15" class="frame"/>
  <text x="490" y="714" text-anchor="middle" class="edge-label">query_outcomes / wiki.feedback -&gt; review_queue 形成后续维护闭环</text>
</svg>
