[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-wiki"
version = "0.2.0"
description = "Agent Wiki Phase 1 core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Chao" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "mcp>=1.9.0,<2.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0"
]

[project.scripts]
aw = "agent_wiki.transports.cli.app:main"
aw-agent = "agent_wiki.transports.cli.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wiki"]
