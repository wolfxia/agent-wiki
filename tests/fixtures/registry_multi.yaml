version: 1
default_route_policy: purpose_then_topic
wikis:
  - wiki_id: personal-1
    type: personal
    workspace_path: ./tests/fixtures/sample_wiki
    purpose_path: purpose.md
    config_path: config.yaml
    allowed_page_types: [raw, atom, synthesis, principle]
    external_views:
      - adapter: plain_markdown
        mode: read_write
    pending_query_policy:
      raw: include_by_default
      atom: exclude_by_default
      synthesis: exclude_by_default
      principle: exclude_by_default
    retrieval:
      coarse_provider: lexical
      optional_providers: [local_vector, embedding]
      route_priority: 80
      embedding:
        provider: siliconflow
        base_url: https://api.siliconflow.cn/v1
        api_key_env: SILICONFLOW_API_KEY
        model: BAAI/bge-m3
        dimension: 1024
        batch_size: 32
    permissions:
      - actor_type: agent
        actor_id: hermes
        allowed_operations: [query, capture_raw, compile_update, lint, sync]
        max_gate: C
        allowed_page_types: [raw, atom, synthesis]
      - actor_type: agent
        actor_id: openclaw
        allowed_operations: [query, capture_raw, compile_update, lint, sync]
        max_gate: C
        allowed_page_types: [raw, atom, synthesis]
      - actor_type: agent
        actor_id: claude-code
        allowed_operations: [query, capture_raw, compile_update, lint, sync]
        max_gate: B
        allowed_page_types: [raw, atom, synthesis]
      - actor_type: agent
        actor_id: codex
        allowed_operations: [query, capture_raw]
        max_gate: A
        allowed_page_types: [raw]

  - wiki_id: shared-1
    type: shared
    workspace_path: ./tests/fixtures/shared_wiki
    purpose_path: purpose.md
    config_path: config.yaml
    allowed_page_types: [synthesis, principle]
    external_views:
      - adapter: plain_markdown
        mode: read_write
    pending_query_policy:
      raw: include_by_default
      atom: exclude_by_default
      synthesis: exclude_by_default
      principle: exclude_by_default
    retrieval:
      coarse_provider: lexical
      optional_providers: []
      route_priority: 100
    permissions:
      - actor_type: agent
        actor_id: hermes
        allowed_operations: [query, compile_update, approve_proposal, sync]
        max_gate: C
        allowed_page_types: [synthesis, principle]
      - actor_type: agent
        actor_id: openclaw
        allowed_operations: [query, compile_update, approve_proposal, sync]
        max_gate: C
        allowed_page_types: [synthesis, principle]
      - actor_type: agent
        actor_id: claude-code
        allowed_operations: [query, compile_update, approve_proposal, sync]
        max_gate: C
        allowed_page_types: [synthesis, principle]
      - actor_type: agent
        actor_id: codex
        allowed_operations: [query]
        max_gate: A
        allowed_page_types: [synthesis, principle]
